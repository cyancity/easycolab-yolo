<!doctype html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyColab 工作台</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" />
  <meta name="theme-color" content="#111110" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="nav" aria-label="主导航"></nav>
    <main class="main">
      <header class="topbar">
        <h1 id="title">实例</h1>
        <span class="chip err" id="offline" hidden>工作台服务未响应</span>
        <span class="chip warn" id="cooldown" hidden></span>
        <span class="spacer"></span>
        <button class="btn primary" id="new"><svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>新建部署</button>
      </header>
      <div class="view" id="view"><div class="empty"><p class="muted">正在读取账号…</p></div></div>
    </main>
  </div>
  <div id="sheet"></div>
  <div id="toast"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
