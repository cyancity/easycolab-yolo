# Windows 桌面客户端安装包。手动运行只产出构建产物；推 v* 标签时另建一个草稿 Release，确认后再手动发布
name: desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.1.0"
        required: false
        default: "0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: python packaging/windows/build.py "${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ColabFleet-Setup
          path: dist/ColabFleet-Setup-*.exe
      - name: Draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = (Get-ChildItem dist/ColabFleet-Setup-*.exe).FullName
          gh release create "${{ github.ref_name }}" $file --draft --title "Colab Fleet ${{ github.ref_name }}" --notes "Windows 安装包"
