name: Build EasyColab Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "windows_app/**"
      - "colab_bridge.py"
      - "app.py"
      - "colab_server/**"
      - "runtime/**"
      - "EasyColab_Server.ipynb"
      - ".github/workflows/build-windows.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64 Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: windows_app/requirements-windows.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows_app/requirements-windows.txt

      - name: Generate multi-size AppIcon.ico
        run: python windows_app/generate_icon.py

      - name: Build standalone EasyColab.exe via PyInstaller
        run: |
          pyinstaller --noconfirm --clean `
            --distpath dist `
            --workpath build/pyinstaller `
            windows_app/EasyColab.spec

      - name: Smoke-test packaged EasyColab.exe (CLI bridge & Qt offscreen boot)
        shell: pwsh
        run: |
          $out = & .\dist\EasyColab\EasyColab.exe --bridge-cli auth_status
          Write-Host "Bridge CLI smoke output: $out"
          if (-not ($out -match '"ok"')) {
            throw "EasyColab.exe --bridge-cli smoke test failed!"
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from windows_app.viewmodel import EasyColabViewModel; from windows_app.main_window import EasyColabMainWindow; app = QApplication([]); vm = EasyColabViewModel(); vm.has_seen_onboarding = True; w = EasyColabMainWindow(vm); w.show(); app.processEvents(); w.close(); print('Qt UI smoke test passed!')"

      - name: Package EasyColab-Windows-x64.zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\EasyColab" -DestinationPath "EasyColab-Windows-x64.zip" -Force
          Get-Item "EasyColab-Windows-x64.zip" | Select-Object Name, Length

      - name: Upload EasyColab-Windows-x64.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyColab-Windows-x64
          path: EasyColab-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (on tag push v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EasyColab-Windows-x64.zip
          generate_release_notes: true
